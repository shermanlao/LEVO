<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rectangle -->
  <rect width="800" height="600" fill="#f5f5f5"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="none" stroke="#e0e0e0" stroke-width="1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#grid)"/>
  
  <!-- Center emblem -->
  <circle cx="400" cy="300" r="150" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
  
  <!-- Icon in center -->
  <g transform="translate(320, 220)">
    <path d="M80 0L160 120H0L80 0Z" fill="#cccccc"/>
    <path d="M30 120H130V160H30V120Z" fill="#cccccc"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="420" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#888888">Product Image</text>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#aaaaaa">Image Coming Soon</text>
</svg> 